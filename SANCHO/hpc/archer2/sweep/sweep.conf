# =============================================================================
# sweep.conf  --  settings shared by every script in this folder (ARCHER2)
# (sourced by bash, so no spaces around '=')
# Everything must live under /work: ARCHER2 compute nodes cannot see /home.
# =============================================================================

# --- the executable every run uses (build it in SANCHO/: make PLATFORM=archer2)
BIN=$PWD/../../../bin/sancho.x   # = SANCHO/bin/sancho.x; scripts always source this from the sweep folder

# --- where things go (relative to this folder)
DEFAULTS=defaults.dat        # every input.dat key with its default value
RUNS_DIR=runs                # one sub-directory per run
LOG_DIR=logs                 # Slurm stdout/stderr of the array tasks
RESULTS=results_IV.dat       # table written by collect.sh

# --- Slurm: one array task = one whole node running RUNS_PER_NODE runs side by side
JOB_NAME=Broyden
ACCOUNT=PROJECT              # your ARCHER2 budget code, e.g. e123
PARTITION=standard
QOS=standard
TIME=12:00:00
RUNS_PER_NODE=8              # runs sharing a node
CPUS=16                      # OpenMP threads per run  (RUNS_PER_NODE*CPUS <= 128)
MEM_PER_RUN=30G              # memory per run          (RUNS_PER_NODE*MEM_PER_RUN < ~250G)
MAX_PARALLEL=10              # at most this many nodes at once (array %limit)

# --- modules loaded inside the job (and needed to build the code)
MODULES="PrgEnv-gnu"
